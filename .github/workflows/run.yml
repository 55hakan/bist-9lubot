name: BIST Master Bot

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Çalıştırılacak Strateji'
        required: true
        default: 'Hepsi'
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install pandas numpy requests yfinance

      - name: Botu Başlat
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SELECTED_STRATEGY: ${{ github.event.inputs.strategy || 'Hepsi' }}
        run: python scanner.py
