name: BIST Sinyal Tarayici

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Çalıştırılacak Strateji'
        required: true
        default: 'Hepsi'
        type: choice
        options:
          - 'Hepsi'
          - 'Uzun Vade Ralli'
          - 'Base 30 Kesisişi'
          - 'Matrix Orta Hat'
          - 'Uclu Kesisim'
          - 'Leda Gunluk'
          - 'Leda Haftalik'
          - 'HU Gunluk'
          - 'Mavilim Haftalik'
          - 'Hassas Dip Orta'
          - 'Auto VWAP2'
  repository_dispatch:
    types: [run-strategy]

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install pandas numpy requests yfinance

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SELECTED_STRATEGY: ${{ github.event.client_payload.strategy || github.event.inputs.strategy || 'Hepsi' }}
        run: |
          python scanner.py
