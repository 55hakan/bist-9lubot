name: BIST Master Bot

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Çalıştırılacak Strateji'
        required: true
        default: 'Hepsi'
  schedule:
    # Türkiye saatiyle 10:20 - 18:20 arası her saat 20 geçe (UTC karşılıkları: 07:20 - 15:20)
    - cron: '20 7,8,9,10,11,12,13,14,15 * * 1-5'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install pandas numpy requests yfinance

      - name: Botu Başlat
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SELECTED_STRATEGY: ${{ github.event.inputs.strategy || 'Hepsi' }}
        run: python scanner.py
